; Archipelago plugin settings. The live copy is in plugin-settings/archipelago/
; beside the game; the panel (F7) saves the connection fields there.

[Client]
; host:port, ws://host:port or wss://host:port. Without a scheme, wss is tried first.
Server=archipelago.gg:38281
Slot=
; Room password, saved in plain text when you connect from the panel.
Password=
AutoConnect=0
; Key that opens the panel: F1-F24 except F8-F11 (used by the recomp).
Hotkey=F7
; In-frame notices for items, hints and chat.
Toasts=1
; Also show item and chat messages through the game's own HUD, one at a time.
HudMessages=0

[Bridge]
; Local socket for the Python client and tools/recomp_repl.py (127.0.0.1 only).
; Lua and write requests are refused while the in-game client is active.
Enabled=1
Port=28012
UpdateBudgetMs=4
MaxRequestsPerUpdate=64

[Bounties]
; Guest addresses of the PDA bounty counters (hex, e.g. 0x00412345). Bounty
; checks stay off until these are known; find them with tools/recomp_repl.py.
ListeningPost=
Blueprint=
Monument=
Treasure=
; Counter width in bytes: 1, 2 or 4.
Size=4
